# Local replay demo: listen on this machine only and send no usage statistics.
[server]
address = "localhost"
headless = true
# Serves dashboard/static (bundled fonts and Three.js) at app/static, so the
# dashboard works offline.
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# DRIVEX theme, tuned for comfortable reading: charcoal (not pure black) surfaces,
# off-white text, cyan for active states. Tokens mirror dashboard/theme.py.
[theme]
base = "dark"
primaryColor = "#00E5E5"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#1D232C"
textColor = "#E6E8EB"
linkColor = "#5EEAEA"
borderColor = "#2B333E"
showWidgetBorder = true
baseRadius = "10px"
baseFontSize = 15
font = "Inter"
headingFont = "Space Grotesk"
codeFont = "JetBrains Mono"
headingFontWeights = [700, 600, 600, 600, 600, 600]
codeBackgroundColor = "#1D232C"
dataframeHeaderBackgroundColor = "#1D232C"
redColor = "#EF4444"
greenColor = "#22C55E"
orangeColor = "#F59E0B"
chartCategoricalColors = ["#00E5E5", "#F472B6", "#A78BFA", "#F59E0B", "#22C55E", "#EF4444"]

[theme.sidebar]
backgroundColor = "#12161C"
secondaryBackgroundColor = "#1D232C"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
