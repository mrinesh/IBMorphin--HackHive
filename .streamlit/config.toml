# Local replay demo: listen on this machine only and send no usage statistics.
[server]
address = "localhost"
headless = true
# Serves dashboard/static (bundled fonts and Three.js) at app/static, so the
# dashboard works offline.
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Dark soft-UI theme. Tokens mirror dashboard/theme.py.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#111A2C"
textColor = "#E6EDF7"
linkColor = "#22D3EE"
borderColor = "#1E293B"
showWidgetBorder = true
baseRadius = "12px"
baseFontSize = 15
font = "DM Sans"
headingFont = "Sora"
headingFontWeights = [700, 600, 600, 600, 600, 600]
codeBackgroundColor = "#0B1324"
dataframeHeaderBackgroundColor = "#0F172A"
redColor = "#F87171"
greenColor = "#4ADE80"
chartCategoricalColors = ["#22D3EE", "#F472B6", "#A78BFA", "#FBBF24", "#4ADE80", "#FB7185"]

[theme.sidebar]
backgroundColor = "#0A1120"
secondaryBackgroundColor = "#111A2C"

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "DM Sans"
url = "app/static/fonts/dm-sans-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "Sora"
url = "app/static/fonts/sora-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Sora"
url = "app/static/fonts/sora-latin-700-normal.woff2"
weight = 700
