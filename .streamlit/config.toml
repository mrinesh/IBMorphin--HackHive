# Local replay demo: listen on this machine only and send no usage statistics.
[server]
address = "localhost"
headless = true
# Serves dashboard/static (bundled fonts and Three.js) at app/static, so the
# dashboard works offline.
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# DRIVEX theme: graphite surfaces, off-white text, system blue for active states.
# Tokens mirror dashboard/theme.py.
[theme]
base = "dark"
primaryColor = "#0A84FF"
backgroundColor = "#141416"
secondaryBackgroundColor = "#29292D"
textColor = "#F5F5F7"
linkColor = "#64D2FF"
borderColor = "#34343A"
showWidgetBorder = false
baseRadius = "10px"
baseFontSize = 16
font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"
headingFontWeights = [700, 600, 600, 600, 600, 600]
codeBackgroundColor = "#29292D"
dataframeHeaderBackgroundColor = "#29292D"
redColor = "#FF453A"
greenColor = "#30D158"
orangeColor = "#FF9F0A"
blueColor = "#0A84FF"
violetColor = "#BF5AF2"
chartCategoricalColors = ["#64D2FF", "#7D7AFF", "#0A84FF", "#40C8E0", "#9FDCFF", "#8E8E93"]

[theme.sidebar]
backgroundColor = "#141416"
secondaryBackgroundColor = "#29292D"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/space-grotesk-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "JetBrains Mono"
