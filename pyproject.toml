[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "engine-diagnostics"
version = "0.1.0"
description = "MATLAB/Python multisensor engine diagnostics hackathon prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
analysis = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<25",
    "scikit-learn>=1.6,<2",
]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.scripts]
engine-diagnostics = "engine_diagnostics.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]
quality = ["ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/engine_diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
